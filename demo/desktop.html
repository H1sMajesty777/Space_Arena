<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPACE ARENA — баннер на рабочем столе</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { display: grid; place-items: center; overflow: hidden; }
    .desktop {
      position: relative;
      width: min(100vw, 177.77778vh);
      aspect-ratio: 16 / 9;
      background: #080512 url('./desktop.jpg') center / 100% 100% no-repeat;
    }
    .banner {
      position: absolute;
      top: 8.3%;
      right: 2.1%;
      width: 46.9%;
      height: 50.7%;
      border: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="desktop" aria-label="Рабочий стол SPACE ARENA с баннером справа сверху">
    <iframe class="banner" title="Анимированный баннер SPACE ARENA" src="./banner/index.html"></iframe>
  </main>
  <script>
    // R повторяет анимацию, не добавляя элементов управления на рабочий стол.
    window.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() !== 'r') return;
      document.querySelector('.banner').src = './banner/index.html?replay=' + Date.now();
    });
  </script>
</body>
</html>
