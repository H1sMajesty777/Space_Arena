limit_req_zone $binary_remote_addr zone=entry:10m rate=2r/s;
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 13m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /order.html { return 302 /order; }
    location = /order {
        limit_req zone=entry burst=30 nodelay;
        access_log off;
        proxy_pass $api_upstream;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location = /_guest_page {
        internal;
        types { }
        default_type text/html;
        alias /usr/share/nginx/html/order.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /health {
        proxy_pass $api_upstream;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        add_header X-Content-Type-Options nosniff;
    }

    location /frontend-assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
